<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Change password — SHEGLAM PK Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login">
    <div class="brand">SHEGLAM<span>.PK</span><em>ADMIN</em></div>
    <h1 id="head">Change your password</h1>
    <p class="sub" id="sub">Pick something only you know.</p>

    <div class="msg msg--err" id="err" hidden></div>
    <div class="msg" id="note" hidden></div>

    <form id="form" novalidate>
      <div class="field">
        <label for="cur">Current password</label>
        <input id="cur" type="password" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="nw">New password</label>
        <div class="pw">
          <input id="nw" type="password" autocomplete="new-password" required>
          <button type="button" id="toggle" aria-label="Show password">Show</button>
        </div>
        <ul class="rules" id="rules">
          <li data-rule="len">At least 10 characters</li>
          <li data-rule="letter">Contains a letter</li>
          <li data-rule="digit">Contains a number</li>
          <li data-rule="common">Not an obvious password</li>
        </ul>
      </div>
      <div class="field">
        <label for="cf">Confirm new password</label>
        <input id="cf" type="password" autocomplete="new-password" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit" id="go">Save new password</button>
    </form>

    <p class="hint">Saving signs out every other device using this account.<br>
      Your password is never shown to anyone, including the other admin.</p>
  </div>
</div>

<script src="/admin/admin.js"></script>
<script>
(function () {
  "use strict";
  const A = window.Admin, { $, $$, esc } = A;

  const err = $("#err"), note = $("#note");
  const showError = (m) => { err.textContent = m; err.hidden = !m; };

  $("#toggle").addEventListener("click", () => {
    const input = $("#nw"), btn = $("#toggle");
    const showing = input.type === "password";
    input.type = showing ? "text" : "password";
    btn.textContent = showing ? "Hide" : "Show";
    input.focus();
  });

  /* Mirrors lib/auth.js checkStrength so the hints match what the server
     will actually accept. The server remains the authority. */
  const COMMON = ["password","password1","password123","12345678","123456789",
    "qwerty123","admin123","letmein","welcome1","sheglam","sheglampk",
    "umama123","ashba123","adminadmin"];

  function grade(p) {
    return {
      len: p.length >= 10,
      letter: /[a-z]/i.test(p),
      digit: /[0-9]/.test(p),
      common: p.length > 0 && !COMMON.includes(p.toLowerCase()) && !/^(.)\1+$/.test(p),
    };
  }

  $("#nw").addEventListener("input", () => {
    const g = grade($("#nw").value);
    $$("#rules li").forEach((li) => li.classList.toggle("ok", !!g[li.dataset.rule]));
  });

  /* This page is reachable both as a forced step and voluntarily. */
  fetch("/api/admin/session")
    .then((r) => r.ok ? r.json() : Promise.reject(new Error("Not signed in")))
    .then((s) => {
      if (s.user.mustChangePassword) {
        $("#head").textContent = "Set your password";
        $("#sub").textContent = "This account is using a temporary password.";
        note.textContent = "You cannot use the portal until this is changed.";
        note.hidden = false;
      }
    })
    .catch(() => { location.href = "/admin/login?next=/admin/password"; });

  $("#form").addEventListener("submit", async (e) => {
    e.preventDefault();
    showError("");

    const cur = $("#cur").value, nw = $("#nw").value, cf = $("#cf").value;
    if (nw !== cf) { showError("The two new passwords do not match."); $("#cf").focus(); return; }

    const g = grade(nw);
    if (!Object.values(g).every(Boolean)) {
      showError("That password does not meet the requirements listed above.");
      $("#nw").focus();
      return;
    }

    const btn = $("#go");
    btn.disabled = true; btn.textContent = "Saving…";

    try {
      /* Not A.api(): its 403 handler would bounce this very page. */
      const sess = await (await fetch("/api/admin/session")).json();
      const res = await fetch("/api/admin/password", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRF-Token": sess.csrfToken },
        body: JSON.stringify({ currentPassword: cur, newPassword: nw }),
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok && data.ok) { location.href = "/admin"; return; }
      showError(data.error || "Could not change the password.");
    } catch {
      showError("Could not reach the server. Check your connection and try again.");
    } finally {
      btn.disabled = false; btn.textContent = "Save new password";
    }
  });

  $("#cur").focus();
})();
</script>
</body>
</html>
