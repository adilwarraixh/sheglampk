- main [ref=f1e2]:
  - heading "Uniman logo, round 1" [level=1] [ref=f1e3]
  - paragraph [ref=f1e4]: Six designers each drew one meaningful object, checked it from the 16 px tab icon up to the 180 px app icon in light and dark, and an independent judge then scored all six side by side. Ordered by the judge's score. Every mark here is one colour so it follows the theme, like the current logo.
  - generic [ref=f1e5]:
    - text: "Judge's bottom line: none of the six is ready to ship as drawn. Only the top two are worth refining."
    - list [ref=f1e6]:
      - listitem [ref=f1e7]: "Master Key has the best meaning: one key that opens every part of the business, and keys belong to hotels, shops, clinics and real estate alike. Its round bow with a U cut out looks like the kosher-certification (OU) symbol, so the bow has to become a classic skeleton-key bow."
      - listitem [ref=f1e8]: Storefront builds the U in best (the doorway) and sits best next to the wordmark. It is close to the generic "shop" icon used by Google Business and POS apps, and it says "retail" only.
