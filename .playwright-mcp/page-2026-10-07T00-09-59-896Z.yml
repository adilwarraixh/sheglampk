    - generic [ref=f1e89]:
      - paragraph [ref=f1e90]: "Judge: Best of the set. It is clearly a key at every size, and the master-key idea fits every vertical, because hotels, real estate, shops and clinics all run on keys. It is not finished. The solid disc with a knocked-out U is the OU kosher symbol in negative, and that is a real problem on restaurant receipts and menus. The round notch in the bit disappears below 48 px. The 45-degree lean puts the weight at the bottom left, so in the lockup the mark looks small and tilted next to the heavy wordmark. At 180 px it reads as a password-manager icon more than a premium brass key."
      - paragraph [ref=f1e91]: "Looks like: HIGH: a disc with a U is the OU kosher certification mark (Orthodox Union), which matters for restaurant clients. MEDIUM: key icons are the default symbol for password managers and security apps (KeePass, Keychain), and keys are common in locksmith and real-estate logos."
