    - generic [ref=f1e263]:
      - paragraph [ref=f1e264]: "Judge: The most ownable story: the national animal, and continuity with the old Markhor brand. The drawing does not deliver it. The corkscrew horns are stacks of thin slivers held together by a 0.8 stroke, well under the 3.5-unit minimum. They render as serrated spikes or drill bits, and at 16 px the whole mark collapses into a trident or Psi glyph. The face is a hollow U with no features, so it reads as a horned U or devil mask more than a markhor. Its narrow, spiky silhouette looks frail next to the slab-heavy wordmark."
      - paragraph [ref=f1e265]: "Looks like: MEDIUM-HIGH: in Pakistan a markhor head is strongly linked with the ISI emblem and military insignia; at small sizes it reads as a trident or the Psi symbol (Ψ) or devil horns. Low risk against global tech marks."
